# Requests are redirected to a fixed host, like on a server where a placeholder from an example configuration was
# left in place. The target host doesn't depend on the request, so none of these servers is an open redirect.
server {
    listen 80;
    return 301 https://example.com/;
}

server {
    listen 8080;
    return 302 http://www.example.com;
}

# / is served, every other path is redirected to a fixed placeholder.
server {
    listen 8081;
    location = / {
        return 200 "Home page";
    }
    location / {
        return 301 https://example.com/;
    }
}

# A fixed placeholder host with the request path appended.
server {
    listen 8082;
    return 301 https://example.com$request_uri;
}

# The request path is put in the query string of a fixed address.
server {
    listen 8083;
    return 302 https://www.example.com/?next=$request_uri;
}
