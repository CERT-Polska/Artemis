  cpe-nvd-data: null
  data-nuclei-config: null
  data-nuclei-templates: null
  data-postgres: null
  data-redis: null
  data-web: null
networks:
  default:
    driver: bridge
    # If this MTU is larger than the MTU of the VPN, packets entering the tunnel
    # gateway from outside can be dropped server-side, leading to silent timeouts from the
    # perspective of processes in Docker. Has to be aligned with "mtu" in /etc/docker/daemon.json.
    driver_opts:
      com.docker.network.driver.mtu: "1351"
x-artemis-build-or-image:
  dns_opt: *id001
  image: ${ARTEMIS_BUILD_IMAGE:-certpl/artemis:latest}
x-logging:
  logging: *id002
