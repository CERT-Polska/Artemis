id: 403-bypass-using-headers

info:
  name: 403 Forbidden Bypass Detection with Headers
  author: Dr4g0n
  severity: medium
  description: |
    Detects potential 403 Forbidden bypass vulnerabilities by adding headers (e.g., X-Forwarded-For, X-Original-URL).

http:
  - raw:
      - |
        GET {{Path}} HTTP/1.1
        Host: {{Hostname}}
        {{header}}: 127.0.0.1

    attack: batteringram
    payloads:
      header:
        - X-Forwarded-For
        - X-Remote-IP
        - X-Remote-Addr
        - X-Real-IP

    # One bypassing header is enough to prove the finding. Without this, every
    # header that works produces its own identical result.
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - "status_code >= 200"
          - "status_code < 300"
          - "len(body) >= 200"
          - "!contains(body, '<title>Request Rejected</title>')"
          - "!contains(body, '<TITLE>Unauthorized Request Blocked</TITLE>')"
        condition: and
