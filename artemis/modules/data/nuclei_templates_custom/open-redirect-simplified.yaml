id: open-redirect-simplified

info:
  name: Open Redirect - Simplified Detection
  author: kazet
  severity: medium
  description: An open redirect vulnerability was detected. An attacker can redirect a user to a malicious site and possibly obtain sensitive information, modify data, and/or execute unauthorized operations.
  reference:
    - https://wiedza.cert.pl/odpornosc-infrastruktury/bezpieczenstwo-webowe/open-redir/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  tags: redirect,generic

http:
  - method: GET
    path:
      - "{{RootURL}}/{{redirect}}"

    payloads:
      redirect:
        - '.artemis-redirect-test.example.com'
        - 'artemis-redirect-test.example.com/'
        - 'artemis-redirect-test.example.com'
        - '/%5C%5Cartemis-redirect-test.example.com/%252e%252e%252f'
        - '//artemis-redirect-test.example.com/%2f..'
        - '/http%3A%2F%2Fartemis-redirect-test.example.com'
        - '/artemis-redirect-test.example.com/'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          # Regex matchers don't render runtime variables such as the payloads, so the label is repeated here.
          # Based on https://regex101.com/r/ZDYhFh/1
          - '(?m)^(?:Location\s*?:\s*?)(?:https?:\/\/|\/\/|\/\\\\|\/\\)(?:[a-zA-Z0-9\-_\.@]*)artemis-redirect-test\.example\.com\/?(\/|[^.].*)?$'

      - type: status
        status:
          - 301
          - 302
          - 307
          - 308
        condition: or
