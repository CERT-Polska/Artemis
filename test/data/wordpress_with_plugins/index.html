<!DOCTYPE html>
<html>
<head>
<title>WordPress with plugins</title>
<!--
A WordPress-shaped static site, just enough of one for the wordpress_plugins module to find two
plugins and read their versions. The real thing isn't used because the module identifies plugins by
fetching /wp-content/plugins/<slug>/readme.txt, which a stock WordPress container doesn't have.
-->
<link rel="stylesheet" href="/wp-content/plugins/contact-form-7/includes/css/styles.css">
<link rel="stylesheet" href="/wp-content/plugins/kirki/assets/css/kirki-styles.css">
</head>
<body>
<h1>WordPress with plugins</h1>
</body>
</html>
