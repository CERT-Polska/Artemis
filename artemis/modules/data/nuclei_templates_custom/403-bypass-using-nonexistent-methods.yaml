id: 403-bypass-using-nullbyte

info:
  name: 403 Forbidden Bypass Detection
  author: Dr4g0n
  severity: medium
  description: |
    Detects potential 403 Forbidden bypass vulnerabilities by using nonexistent HTTP methods.

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET {{Path}} HTTP/1.1
        Host: {{Hostname}}

      - |
        GET {{Path}} HTTP/1.1
        Host: {{Hostname}}

      - |
        GET {{Path}} HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        name: forbidden
        dsl:
          # Perform the same request multiple times to make sure it was not a random 403
          - "status_code_1 == 403"
          - "status_code_2 == 403"
          - "status_code_3 == 403"
        condition: and
        internal: true

  - raw:
      - |
        NONEXISTENT {{Path}} HTTP/1.1
        Host: {{Hostname}}

      - |
        NONEXISTENT {{Path}} HTTP/4
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - "status_code >= 200"
          - "status_code < 300"
          - "len(body) >= 200"
          - "!contains(body, '<title>Request Rejected</title>')"
          - "!contains(body, '<TITLE>Unauthorized Request Blocked</TITLE>')"
        condition: and
