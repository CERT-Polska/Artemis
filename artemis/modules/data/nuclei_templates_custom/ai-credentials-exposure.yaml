id: ai-credential-file-exposure

info:
  name: OpenAI, Anthropic and Azure OpenAI Credential File Exposure
  author: custom
  severity: high
  description: |
    Checks the supplied credential/configuration paths for exposed API keys.
    A finding requires HTTP 200 and a key-shaped value, not merely a filename
    or environment variable name. Keys are not validated against provider APIs.
  tags: exposure,config,openai,anthropic,azure,ai

http:
  - method: GET
    path:
        - "{{ BaseURL }}{{ credential_path }}"
    attack: batteringram
    payloads:
      credential_path:
        - '.anthropic/config.json'
        - 'anthropic/config.json'
        - 'anthropic/config.yaml'
        - 'anthropic/config.yml'
        - '.anthropic/.env'
        - '/anthropic/.env'
        - 'anthropic/.env'
        - 'anthropic/.env.local'
        - 'anthropic/.env.prod'
        - 'anthropic/settings.json'
        - 'api/anthropic/.env'
        - 'api/openai/config.js'
        - 'api/openai/.env'
        - 'azure-openai/.env'
        - 'azure/openai/.env'
        - '.azure/openai.json'
        - '/config/openai.json'
        - 'config/openai.json'
        - 'config/openai.yaml'
        - '.env.anthropic'
        - '.env'
        - '.env.openai'
        - '.github/workflows/openai.yml'
        - 'lib/azure-openai.js'
        - '.openai/api_key.txt'
        - 'openai/api-key.txt'
        - 'openai/api_key.txt'
        - 'openai/apikey.txt'
        - '.openai/config.json'
        - '/openai/config.json'
        - 'openai-config.json'
        - 'openai/config.json'
        - 'openai/config.yaml'
        - 'openai/config.yml'
        - '.openai/credentials.json'
        - 'openai/credentials.json'
        - '.openai/.env'
        - '/openai/.env'
        - 'openai/.env'
        - 'openai/.env.local'
        - 'openai/.env.prod'
        - '.openai/key.json'
        - 'openai/keys.json'
        - 'openai/key.txt'
        - 'openai/secrets.json'
        - 'openai/settings.json'
        - 'services/azure/openai.json'
        - 'services/openai/config.js'
        - 'services/openai/index.js'

    matchers-condition: or
    matchers:
      - type: dsl
        name: openai-or-anthropic-key
        dsl:
          - status_code == 200 && (regex('sk-[a-zA-Z0-9-]*', body) || (regex('\bsk-ant-', body))) && (!regex('<html', tolower(body)))
