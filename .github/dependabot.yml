version: 2
updates:
  # Docker updates
  - package-ecosystem: "docker"
    directory: "/docker/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        versions: ["4.x"]  # Stick to Python 3.x
    cooldown:
      default-days: 7

  # Go modules
  - package-ecosystem: "gomod"
    directory: "/docker/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Go modules of the Wappalyzer wrapper used for web technology identification. Its wappalyzergo
  # dependency carries the fingerprint database, so these bumps also refresh technology detection.
  - package-ecosystem: "gomod"
    directory: "/artemis/modules/utils/wappalyzer/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Python packages in root
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "*"  # Allow all packages from requirements.txt
    cooldown:
      default-days: 7

  # Python packages in /docs/
  - package-ecosystem: "pip"
    directory: "/docs/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "*"  # Allow all packages from requirements.txt
    cooldown:
      default-days: 7

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
