[dashboard]
base_path=/karton-dashboard/

[s3]
# These need to be provided, so let's provide a mock - but we don't want to have a proper
# s3-compatible storage instance, as we don't use this feature.
address=http://s3mock:9090/
access_key=
secret_key=
bucket=bucket

[redis]
host=redis
port=6379
db=0

[system]
# Artemis relies on karton-system removing the crashed tasks after this many seconds;
# see _update_analysis_finished_times in artemis/cleanup.py for the explanation.
# Parameter documentation:
# https://github.com/CERT-Polska/karton/blob/main/docs/service_configuration.rst#L114
task_crashed_timeout = 259200
