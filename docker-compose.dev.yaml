    environment:
    - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=bucket
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 10s
      test: wget 127.0.0.1:9090 -O/dev/null || exit 1
      timeout: 5s
    image: adobe/s3mock:latest
    logging:
      driver: none
    stdin_open: true
    tty: true
